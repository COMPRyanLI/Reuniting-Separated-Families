# PAID Render Blueprint (upgrade path; prepared 2026-10-19, NOT applied or CLI-validated). To use it, set this file as the Blueprint path.
# One Docker image runs as the web service and as the background worker; Render Postgres
# holds the data. No secret values live in this file: DIGEST_KEY is generated by Render,
# FIELD_ENCRYPTION_KEYS / APP_ORIGIN / seed values are entered once in the dashboard.
# Check plan IDs and prices on https://render.com/pricing before applying.

envVarGroups:
  - name: reconnect-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: INCIDENT_SLUG
        value: demo-hurricane-1
      - key: TRUST_PROXY
        value: "1"
      # 256-bit random value generated by Render (base64), shared by web and worker.
      - key: DIGEST_KEY
        generateValue: true
      # Format "v1:<base64 32 bytes>". Enter once; generate locally, never commit.
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: FIELD_ENCRYPTION_ACTIVE_KEY
        value: v1
      # Exact public origin, e.g. https://reconnect-demo.onrender.com (no trailing slash).
      - key: APP_ORIGIN
        sync: false

services:
  - type: web
    name: reconnect-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/api/dist/server.js
    # Applies committed migrations before each deploy; a failure keeps the previous version running.
    preDeployCommand: node node_modules/prisma/build/index.js migrate deploy
    healthCheckPath: /api/health/live
    envVars:
      - fromGroup: reconnect-shared
      - key: DATABASE_URL
        fromDatabase:
          name: reconnect-db
          property: connectionString

  - type: worker
    name: reconnect-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/api/dist/worker.js
    envVars:
      - fromGroup: reconnect-shared
      - key: DATABASE_URL
        fromDatabase:
          name: reconnect-db
          property: connectionString

databases:
  - name: reconnect-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    # No external access; the services use the internal connection string.
    ipAllowList: []
