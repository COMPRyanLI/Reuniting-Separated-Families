name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  database-and-browser:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rf_ci
          POSTGRES_PASSWORD: rf_ci_only
          POSTGRES_DB: rf_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rf_ci -d rf_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Disposable CI-only server. Tests create and drop rf_test_* databases on it.
      TEST_DATABASE_ADMIN_URL: postgresql://rf_ci:rf_ci_only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm run test:e2e
      - run: npm run test:a11y
